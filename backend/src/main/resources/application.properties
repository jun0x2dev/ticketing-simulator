spring.application.name=ticketing-api
spring.profiles.active=local

# @Scheduled 작업(TTL 복구, outbox 발행, 회차/outbox 정리)이 기본 스레드 1개를 나눠 쓰면 하나가 늦어질 때 나머지도 밀리므로 풀을 늘린다.
spring.task.scheduling.pool.size=4
# 브로커 장애 시 send()가 메타데이터를 기다리며 기본 60초까지 막히지 않도록 상한을 둔다 (요청 스레드와 outbox 발행 모두 해당).
spring.kafka.producer.properties.max.block.ms=5000
