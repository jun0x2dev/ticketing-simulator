spring.application.name=ticketing-api
spring.profiles.active=local

# @Scheduled 작업(TTL 복구, outbox 발행, 회차/outbox 정리)이 기본 스레드 1개를 나눠 쓰면 하나가 늦어질 때 나머지도 밀리므로 풀을 늘린다.
spring.task.scheduling.pool.size=4
# 브로커 장애 시 send()가 메타데이터를 기다리며 기본 60초까지 막히지 않도록 상한을 둔다 (요청 스레드와 outbox 발행 모두 해당).
spring.kafka.producer.properties.max.block.ms=5000

# Prometheus가 수집할 지표만 노출한다. 나머지 actuator 엔드포인트(env, beans 등)는 내부 정보가 많아 열지 않는다.
management.endpoints.web.exposure.include=health,prometheus
# 서버가 여러 대가 되어도 대시보드에서 앱 단위로 묶을 수 있게 모든 지표에 앱 이름을 붙인다.
management.metrics.tags.application=${spring.application.name}
# p95 같은 분위수를 서버 여러 대에 걸쳐 합산하려면 앱이 계산한 값이 아니라 히스토그램 버킷을 내보내야 한다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Kafka 직렬화 설정은 환경과 관계없이 같아야 하므로 여기서 관리한다.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# 역직렬화할 수 없는 메시지가 오면 poll 단계에서 예외가 나 같은 메시지를 끝없이 다시 읽는다(파티션 정지).
# ErrorHandlingDeserializer로 감싸 실패를 에러 핸들러로 넘기고, 에러 핸들러가 DLT로 보낸 뒤 다음 메시지로 넘어간다.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ticketing.api.domain.queue.dto
