spring.application.name=ticketing-api
spring.profiles.active=local

# @Scheduled 작업(TTL 복구, outbox 발행, 회차/outbox 정리)이 기본 스레드 1개를 나눠 쓰면 하나가 늦어질 때 나머지도 밀리므로 풀을 늘린다.
spring.task.scheduling.pool.size=4
# 브로커 장애 시 send()가 메타데이터를 기다리며 기본 60초까지 막히지 않도록 상한을 둔다 (요청 스레드와 outbox 발행 모두 해당).
spring.kafka.producer.properties.max.block.ms=5000

# Kafka 직렬화 설정은 환경과 관계없이 같아야 하므로 여기서 관리한다.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# 역직렬화할 수 없는 메시지가 오면 poll 단계에서 예외가 나 같은 메시지를 끝없이 다시 읽는다(파티션 정지).
# ErrorHandlingDeserializer로 감싸 실패를 에러 핸들러로 넘기고, 에러 핸들러가 DLT로 보낸 뒤 다음 메시지로 넘어간다.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ticketing.api.domain.queue.dto
